name: Update calendar.json

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build calendar.json
        env:
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
        run: python3 build_calendar.py

      - name: Commit if changed
        run: |
          git config user.name "cal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "update calendar.json [skip ci]"
            git push
          fi
