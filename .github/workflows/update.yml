name: Update calendar.json

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      list_properties:
        description: "Hostexの物件ID一覧をログに出すだけ（calendar.jsonは更新しない）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List Hostex properties
        if: ${{ inputs.list_properties }}
        env:
          HOSTEX_ACCESS_TOKEN: ${{ secrets.HOSTEX_ACCESS_TOKEN }}
        run: python3 build_calendar.py --list-properties

      - name: Build calendar.json
        if: ${{ !inputs.list_properties }}
        env:
          HOSTEX_ACCESS_TOKEN: ${{ secrets.HOSTEX_ACCESS_TOKEN }}
          HOSTEX_ROOMS: ${{ secrets.HOSTEX_ROOMS }}
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
        run: python3 build_calendar.py

      - name: Commit if changed
        if: ${{ !inputs.list_properties }}
        run: |
          git config user.name "cal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "update calendar.json [skip ci]"
            git push
          fi
